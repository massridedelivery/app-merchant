name: Release iOS (App Store / TestFlight)

# Builds a signed IPA and uploads it to TestFlight via Fastlane.
# Requires a PAID Apple Developer account with an iOS Distribution certificate.
# Trigger by pushing a tag like v1.0.0, or manually.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.6"

jobs:
  release:
    name: Build & deploy to TestFlight
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Ruby (Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      # App Store Connect API key, base64-encoded in secrets, written to disk
      # for Fastlane to authenticate without an Apple ID / 2FA.
      - name: Write App Store Connect API key
        run: |
          mkdir -p ios/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" | base64 --decode > ios/private_keys/AuthKey.p8

      - name: Deploy to TestFlight
        working-directory: ios
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          # Fastlane match: reads distribution certs/profiles from a private git repo.
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane ios beta

      - name: Archive IPA
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: warn
