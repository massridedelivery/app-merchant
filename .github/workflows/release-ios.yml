name: Release iOS (App Store / TestFlight)

# Builds a signed IPA and uploads it to TestFlight via Fastlane.
# Requires a PAID Apple Developer account with an iOS Distribution certificate.
# Auto-runs on push to main (TestFlight), on tag v*, or manually.
on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  # TestFlight rejects duplicate build numbers; never upload two at once.
  group: release-ios-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.41.6"

jobs:
  # Gate: if the Apple signing/publishing secrets aren't configured yet, skip the
  # release job cleanly (grey "skipped") instead of failing the build.
  # Note: macOS runners are billed at a higher rate, so skipping early matters.
  check-secrets:
    name: Check release secrets
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check for required secrets
        id: check
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          MATCH_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PW: ${{ secrets.MATCH_PASSWORD }}
          MATCH_AUTH: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          missing=""
          [ -z "$KEY_ID" ]     && missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -z "$ISSUER_ID" ]  && missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -z "$API_KEY" ]    && missing="$missing APP_STORE_CONNECT_API_KEY_BASE64"
          [ -z "$MATCH_URL" ]  && missing="$missing MATCH_GIT_URL"
          [ -z "$MATCH_PW" ]   && missing="$missing MATCH_PASSWORD"
          [ -z "$MATCH_AUTH" ] && missing="$missing MATCH_GIT_BASIC_AUTHORIZATION"

          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "### ⏭️ TestFlight release skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Missing secrets:$missing" >> "$GITHUB_STEP_SUMMARY"
            echo "See \`docs/RELEASE_SETUP_STEPS.md\` (Part B) to configure them." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::TestFlight release skipped — missing secrets:$missing"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build & deploy to TestFlight
    runs-on: macos-14
    needs: check-secrets
    if: needs.check-secrets.outputs.configured == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Ruby (Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      # App Store Connect API key, base64-encoded in secrets, written to disk
      # for Fastlane to authenticate without an Apple ID / 2FA.
      - name: Write App Store Connect API key
        run: |
          mkdir -p ios/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" | base64 --decode > ios/private_keys/AuthKey.p8

      - name: Deploy to TestFlight
        working-directory: ios
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          # Fastlane match: reads distribution certs/profiles from a private git repo.
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          # Unique, increasing CFBundleVersion for each TestFlight upload.
          BUILD_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane ios beta

      - name: Archive IPA
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: warn
