name: Release Android (Google Play)

# Builds a signed App Bundle and uploads it to Google Play via Fastlane.
# Track is chosen automatically by trigger:
#   - push to main  -> internal (auto-release for testing)
#   - tag v*        -> production
#   - manual run    -> track chosen in the dropdown
on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play track"
        required: true
        default: "internal"
        type: choice
        options: [internal, alpha, beta, production]

concurrency:
  # Never run two Play uploads at once; cancel superseded main-branch runs.
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.41.6"

jobs:
  # Gate: if the signing/publishing secrets aren't configured yet, skip the
  # release job cleanly (grey "skipped") instead of failing the build.
  check-secrets:
    name: Check release secrets
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check for required secrets
        id: check
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=""
          [ -z "$KEYSTORE" ]          && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ]         && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ]      && missing="$missing ANDROID_KEY_PASSWORD"
          [ -z "$SERVICE_ACCOUNT" ]   && missing="$missing PLAY_SERVICE_ACCOUNT_JSON"

          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "### ⏭️ Play release skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Missing secrets:$missing" >> "$GITHUB_STEP_SUMMARY"
            echo "See \`docs/RELEASE_SETUP_STEPS.md\` (Part A) to configure them." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Play release skipped — missing secrets:$missing"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build & deploy to Play
    runs-on: ubuntu-latest
    needs: check-secrets
    if: needs.check-secrets.outputs.configured == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Ruby (Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      # Choose the Play track from the trigger: manual input > tag > main push.
      - name: Determine Play track
        id: track
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "track=${{ github.event.inputs.track }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "track=production" >> "$GITHUB_OUTPUT"
          else
            echo "track=internal" >> "$GITHUB_OUTPUT"
          fi

      # --- Decode signing secrets (base64-encoded in GitHub Secrets) ---
      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Decode Play service account JSON
        run: echo "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}" | base64 --decode > android/play-service-account.json

      # --build-number uses the run number so every upload has a unique,
      # monotonically increasing versionCode (Play rejects duplicates).
      - name: Build signed App Bundle
        run: flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define-from-file=env/prod.json

      - name: Upload to Google Play
        working-directory: android
        env:
          SUPPLY_TRACK: ${{ steps.track.outputs.track }}
        run: bundle exec fastlane android deploy

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
